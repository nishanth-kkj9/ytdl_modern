name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend (Node.js web server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Syntax check server modules
        run: node --check web/server.mjs && node --check web/config.mjs && node --check web/eventBus.mjs && node --check web/validate.mjs

      - name: Syntax check routes
        run: node --check web/routes/probe.mjs && node --check web/routes/download.mjs && node --check web/routes/history.mjs && node --check web/routes/status.mjs

      - name: Syntax check services
        run: node --check web/services/engineManager.mjs && node --check web/services/historyService.mjs

      - name: Syntax check middleware
        run: node --check web/middleware/static.mjs

      - name: Run backend unit tests
        working-directory: web
        run: |
          node tests/engineManager.test.mjs
          node tests/historyService.test.mjs
          node tests/routes.test.mjs

  python:
    name: Python Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install -r python-engine/requirements.lock

      - name: Install test runner
        run: |
          pip install pytest

      - name: Syntax check Python files
        run: |
          python -m py_compile python-engine/engine.py
          python -m py_compile python-engine/ipc_main.py
          python -m py_compile python-engine/helpers.py
          python -m py_compile python-engine/logger.py

      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0, 'python-engine'); import engine; import helpers; import logger; print('Python imports OK')"

      - name: Run Python unit tests
        run: |
          cd python-engine
          python -m pytest tests -v

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/

      - name: Start server
        run: |
          cd web
          node server.mjs &
          # Wait for the server to become healthy (retry loop instead of a fixed sleep).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy within 30s" >&2
          exit 1

      - name: Run smoke tests
        run: node test-smoke.mjs
