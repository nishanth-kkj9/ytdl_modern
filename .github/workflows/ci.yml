name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend (Node.js web server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Syntax check server modules
        run: node --check web/server.mjs && node --check web/config.mjs && node --check web/eventBus.mjs && node --check web/validate.mjs

      - name: Syntax check routes
        run: node --check web/routes/probe.mjs && node --check web/routes/download.mjs && node --check web/routes/history.mjs && node --check web/routes/status.mjs

      - name: Syntax check services
        run: node --check web/services/engineManager.mjs && node --check web/services/historyService.mjs

      - name: Syntax check middleware
        run: node --check web/middleware/static.mjs

  python:
    name: Python Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install yt-dlp mutagen

      - name: Syntax check Python files
        run: |
          python -m py_compile python-engine/engine.py
          python -m py_compile python-engine/ipc_main.py
          python -m py_compile python-engine/helpers.py
          python -m py_compile python-engine/logger.py

      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0, 'python-engine'); import engine; import helpers; import logger; print('Python imports OK')"

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start server
        run: |
          cd web
          node server.mjs &
          sleep 3

      - name: Run smoke tests
        run: node test-smoke.mjs