name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# One release build at a time: a rapid tag push cancels the superseded run
# instead of racing it to publish two releases for overlapping refs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Create release archive
        run: |
          mkdir -p release/ytdl-flow/web
          cp -r dist release/ytdl-flow/
          # Curated web/ contents — NEVER copy web/node_modules or web/data/
          # (data/ holds the local user's download history; node_modules is
          # reinstalled by users via npm install).
          # NOTE: New web/ modules must be added to this list.
          cp web/server.mjs web/config.mjs web/eventBus.mjs web/validate.mjs \
             web/package.json web/package-lock.json release/ytdl-flow/web/
          cp -r web/routes web/services web/middleware release/ytdl-flow/web/
          cp -r python-engine release/ytdl-flow/
          rm -rf release/ytdl-flow/python-engine/__pycache__ \
                 release/ytdl-flow/python-engine/.pytest_cache
          cp package.json README.md LICENSE release/ytdl-flow/
          cd release
          tar -czf ytdl-flow-${{ github.ref_name }}.tar.gz ytdl-flow/
          zip -r ytdl-flow-${{ github.ref_name }}.zip ytdl-flow/

      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          sha256sum ytdl-flow-${{ github.ref_name }}.tar.gz \
                    ytdl-flow-${{ github.ref_name }}.zip \
            > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release/ytdl-flow-${{ github.ref_name }}.tar.gz
            release/ytdl-flow-${{ github.ref_name }}.zip
            release/sha256sums.txt
          body: |
            ## YTDL Flow ${{ github.ref_name }}

            ### What's New
            - See the [README](README.md) for setup and usage details.

            ### Installation
            1. Extract the archive to your desired location.
            2. Install Python deps: `pip install -r python-engine/requirements.lock`
            3. Install Node deps: `cd web && npm install`
            4. Start the server: `npm run server`
            5. Open http://127.0.0.1:3000 in your browser.