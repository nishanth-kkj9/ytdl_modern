version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/python-engine"
    schedule:
      interval: "weekly"
  # CI/release actions are pinned by SHA — Dependabot keeps the pins current
  # (and updates the trailing version comment) as new releases land.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
